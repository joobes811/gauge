<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pourwise</title>
<meta http-equiv="refresh" content="0; url=../pourwise/">
<link rel="canonical" href="../pourwise/">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b151b; color: #e8eef0;
         font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; }
  a { color: #e8eef0; }
</style>
<script>
  // Gauge is now Pourwise, at a new address on the same site, so your data comes with it.
  // Stop the old offline copy from loading this page again, then go.
  (async () => {
    try {
      const regs = (await navigator.serviceWorker?.getRegistrations()) ?? [];
      await Promise.all(regs.filter((r) => r.scope.includes('/gauge/')).map((r) => r.unregister()));
    } catch {}
    location.replace('../pourwise/' + location.search);
  })();
</script>
</head>
<body>
<p>Gauge is now <b>Pourwise</b>.<br><a href="../pourwise/">Open Pourwise</a></p>
</body>
</html>
